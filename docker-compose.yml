# MongoDB 8 single-node replica set (rs0) deployment topology.
name: infrapilot

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI: mongodb://${MONGO_APP_USER:?Set MONGO_APP_USER in .env}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/${MONGODB_DB:-infrapilot}?authSource=${MONGODB_DB:-infrapilot}&replicaSet=rs0
  MONGODB_DB: ${MONGODB_DB:-infrapilot}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (min 32 chars)}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  EXPOSE_RESET_TOKEN: ${EXPOSE_RESET_TOKEN:-false}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  MONITOR_MAX_CONCURRENCY: ${MONITOR_MAX_CONCURRENCY:-5}
  MONITOR_TICK_MS: ${MONITOR_TICK_MS:-5000}
  MONITOR_RETENTION_DAYS: ${MONITOR_RETENTION_DAYS:-30}

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/start-mongodb.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-infrapilot}
      MONGODB_DB: ${MONGODB_DB:-infrapilot}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Set MONGO_REPLICA_KEY in .env}
    volumes:
      - mongodata:/data/db
      - ./scripts/start-mongodb.sh:/usr/local/bin/start-mongodb.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  mongo-init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["npx", "tsx", "src/db/bootstrap-mongodb.ts"]
    environment:
      <<: *app-env
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_HOST: mongo
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      <<: *app-env
      INFRAPILOT_EMBEDDED_WORKER: "false"
      BACKEND_API_URL: http://backend:4000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "start", "-w", "apps/backend"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PORT: 4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "start", "-w", "apps/worker"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      INFRAPILOT_EMBEDDED_WORKER: "false"

volumes:
  mongodata:
