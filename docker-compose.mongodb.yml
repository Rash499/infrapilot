# Target MongoDB 8 single-node replica set (rs0) deployment topology.
# Note: docker-compose.yml remains the verified PostgreSQL Compose setup until all service modules
# and the monitoring worker complete their transition from Drizzle to MongoDB.
name: infrapilot-mongodb

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI: mongodb://${MONGO_APP_USER:-infrapilot_user}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/${MONGODB_DB:-infrapilot}?authSource=${MONGODB_DB:-infrapilot}&replicaSet=rs0
  MONGODB_DB: ${MONGODB_DB:-infrapilot}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (min 32 chars)}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  EXPOSE_RESET_TOKEN: ${EXPOSE_RESET_TOKEN:-false}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  MONITOR_MAX_CONCURRENCY: ${MONITOR_MAX_CONCURRENCY:-5}
  MONITOR_TICK_MS: ${MONITOR_TICK_MS:-5000}
  MONITOR_RETENTION_DAYS: ${MONITOR_RETENTION_DAYS:-30}

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-infrapilot}
    volumes:
      - mongodata:/data/db
      - ./scripts/mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

  mongo-init:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["npx", "tsx", "src/db/init.ts"]
    environment:
      <<: *app-env

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      INFRAPILOT_EMBEDDED_WORKER: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npx", "tsx", "src/workers/run.ts"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      INFRAPILOT_EMBEDDED_WORKER: "false"

volumes:
  mongodata:
