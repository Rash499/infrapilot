<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">InfraPilot application architecture</title>
<desc id="desc">Next.js frontend communicates with the Express REST API. The API and independent monitoring worker use shared server-core services and the MongoDB database package to access MongoDB. Shared contracts define API types.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#8ba7d4" stroke-width="1.4"/></marker>
  <style>
    .h{font:700 25px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:14px Inter,Arial,sans-serif;fill:#b6c6df}
    .boxTitle{font:700 20px Inter,Arial,sans-serif;fill:#fff}.boxSub{font:14px Inter,Arial,sans-serif;fill:#dbeafe}
    .label{font:600 13px Inter,Arial,sans-serif;fill:#9fb4d4;letter-spacing:1.4px}
    .line{stroke:#8ba7d4;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#526b91;stroke-width:2;stroke-dasharray:7 7;fill:none}
  </style>
</defs>
<rect width="1200" height="720" rx="26" fill="url(#bg)"/>
<text x="64" y="66" class="label">SYSTEM DESIGN</text>
<text x="64" y="108" class="h">InfraPilot — Application Architecture</text>
<text x="64" y="137" class="sub">Three independently run application processes with shared services and MongoDB persistence</text>
<rect x="64" y="176" width="1072" height="184" rx="20" fill="#101b2d" stroke="#263b5b" stroke-width="1.5"/>
<text x="92" y="210" class="label">APPLICATION LAYER</text>
<g filter="url(#shadow)">
  <rect x="94" y="236" width="282" height="92" rx="14" fill="url(#blue)"/>
  <rect x="459" y="236" width="282" height="92" rx="14" fill="#334155" stroke="#64748b"/>
  <rect x="824" y="236" width="282" height="92" rx="14" fill="url(#green)"/>
</g>
<text x="235" y="274" text-anchor="middle" class="boxTitle">Frontend</text><text x="235" y="300" text-anchor="middle" class="boxSub">Next.js 16 · React 19</text>
<text x="600" y="274" text-anchor="middle" class="boxTitle">Backend API</text><text x="600" y="300" text-anchor="middle" class="boxSub">Express · /api/v1</text>
<text x="965" y="274" text-anchor="middle" class="boxTitle">Monitoring Worker</text><text x="965" y="300" text-anchor="middle" class="boxSub">Independent process</text>
<path d="M376 282 H450" class="line"/><text x="413" y="264" text-anchor="middle" class="sub">HTTP</text>
<rect x="64" y="402" width="1072" height="142" rx="20" fill="#101b2d" stroke="#263b5b" stroke-width="1.5"/>
<text x="92" y="436" class="label">SHARED PACKAGES</text>
<rect x="132" y="458" width="286" height="62" rx="12" fill="#182b46" stroke="#3b82f6"/>
<rect x="457" y="458" width="286" height="62" rx="12" fill="#182b46" stroke="#60a5fa"/>
<rect x="782" y="458" width="286" height="62" rx="12" fill="#182b46" stroke="#34d399"/>
<text x="275" y="484" text-anchor="middle" class="boxTitle" style="font-size:17px">server-core</text><text x="275" y="505" text-anchor="middle" class="boxSub">Business services · helpers</text>
<text x="600" y="484" text-anchor="middle" class="boxTitle" style="font-size:17px">contracts</text><text x="600" y="505" text-anchor="middle" class="boxSub">Shared API contracts</text>
<text x="925" y="484" text-anchor="middle" class="boxTitle" style="font-size:17px">database</text><text x="925" y="505" text-anchor="middle" class="boxSub">MongoDB connection · repositories</text>
<path d="M600 328 V386 H275 V450" class="line"/>
<path d="M965 328 V386 H925 V450" class="line"/>
<path d="M600 328 V450" class="dash"/>
<path d="M418 489 H449" class="dash"/><path d="M743 489 H774" class="dash"/>
<rect x="64" y="586" width="1072" height="86" rx="18" fill="#0c1727" stroke="#10b981" stroke-width="1.6"/>
<g transform="translate(104 606)" fill="none" stroke="#34d399" stroke-width="3"><ellipse cx="28" cy="8" rx="24" ry="8"/><path d="M4 8v32c0 4 11 8 24 8s24-4 24-8V8M4 24c0 4 11 8 24 8s24-4 24-8"/></g>
<text x="190" y="625" class="boxTitle">MongoDB</text><text x="190" y="649" class="boxSub">Application database · replica set configuration</text>
<path d="M925 520 V568 H600 V578" class="line"/>
<text x="1090" y="635" text-anchor="end" class="sub">Runtime persistence</text>
</svg>