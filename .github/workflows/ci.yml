name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to the extra scopes they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JWT_ACCESS_SECRET: ci-only-access-secret-value-0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type generation and type check
        run: |
          npx next typegen apps/frontend
          npm run typecheck
      - name: Demo tooling type check
        run: npm run typecheck:demo
      - name: Unit and component tests
        run: npm test
      - name: Dependency audit (production tree)
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build

  integration:
    name: MongoDB integration and worker pipeline
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JWT_ACCESS_SECRET: ci-only-access-secret-value-0123456789abcdef
      MONGODB_URI: mongodb://127.0.0.1:27017/infrapilot_integration?replicaSet=rs0
      MONGODB_DB: infrapilot_integration
      AUTO_INCIDENT_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name infrapilot-mongo --publish 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all
          ready=false
          for attempt in {1..30}; do
            if docker exec infrapilot-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs infrapilot-mongo
            echo "MongoDB did not start" >&2
            exit 1
          fi
          docker exec infrapilot-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in {1..30}; do
            if docker exec infrapilot-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - name: Initialise collections and indexes
        run: npm run db:init:mongo
      - name: Integration tests (alerts, leases, monitoring pipeline)
        run: npm run test:integration
      - name: Worker boots and serves health
        env:
          WORKER_HEALTH_PORT: "4010"
        run: |
          npm run start:worker > /tmp/worker.log 2>&1 &
          worker_pid=$!
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4010/health/live > /tmp/worker-health.json; then
              cat /tmp/worker-health.json
              kill "$worker_pid"
              exit 0
            fi
            sleep 1
          done
          echo "Worker did not become healthy" >&2
          kill "$worker_pid" || true
          cat /tmp/worker.log
          exit 1

  e2e:
    name: End-to-end (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/infrapilot?replicaSet=rs0
      MONGODB_DB: infrapilot
      JWT_ACCESS_SECRET: ci-only-access-secret-value-0123456789abcdef
      SEED_PASSWORD: CiSeed-Password-2026
      E2E_ADMIN_EMAIL: admin@infrapilot.local
      E2E_ADMIN_PASSWORD: CiSeed-Password-2026
      DEMO_SEED_PASSWORD: CiDemo-Password-2026
      EXPOSE_RESET_TOKEN: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name infrapilot-mongo --publish 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all
          ready=false
          for attempt in {1..30}; do
            if docker exec infrapilot-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs infrapilot-mongo
            echo "MongoDB did not start" >&2
            exit 1
          fi
          docker exec infrapilot-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in {1..30}; do
            if docker exec infrapilot-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - run: npm run db:init:mongo
      - run: npm run db:seed:mongo
      - name: Demo dataset validation (no database writes)
        run: npm run db:seed:demo:dry-run
      - name: Seed the demo environment twice to prove idempotency
        run: |
          npm run db:seed:demo
          npm run db:seed:demo
      - name: Verify the demo environment
        run: npm run db:verify:demo
      - name: Prove demo cleanup is scoped to seeded records
        run: |
          npm run db:seed:demo:cleanup -- --yes
          npm run db:verify:demo -- --expect-empty
      - name: Re-seed the demo data used by the browser suite
        run: |
          npm run db:seed:demo
          npm run db:verify:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright)
        run: |
          set -o pipefail
          # The config owns the reporters: list, an HTML report at the repository root and (in CI) a
          # JSON report the failure summary script reads.
          npm run test:e2e 2>&1 | tee /tmp/playwright.txt
      - name: Report end-to-end failures
        if: failure()
        run: |
          if [ -f /tmp/playwright.json ]; then node scripts/report-e2e-failures.mjs /tmp/playwright.json || true; fi
          if [ -f /tmp/playwright.txt ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' /tmp/playwright.txt | tee playwright-output.txt > /dev/null
            {
              echo "### Playwright output"
              echo '```text'
              grep -E -A 10 '^ *[0-9]+\) ' playwright-output.txt | head -60 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E -A 10 '^ *[0-9]+\) ' playwright-output.txt | head -40 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true
            tail -12 playwright-output.txt | while IFS= read -r line; do echo "::warning::${line:0:900}"; done || true
          else
            echo "::error::Playwright produced no output"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            playwright-output.txt

  codeql:
    name: Code scanning (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.29.5
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.29.5
        with:
          category: "/language:javascript-typescript"

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
