name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Install, lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ci-only-access-secret-value-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type generation and type check
        run: |
          npx next typegen apps/frontend
          npm run typecheck
      - name: Demo tooling type check
        run: npm run typecheck:demo
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/infrapilot?replicaSet=rs0
      MONGODB_DB: infrapilot
      JWT_ACCESS_SECRET: ci-only-access-secret-value-0123456789abcdef
      SEED_PASSWORD: CiSeed-Password-2026
      E2E_ADMIN_EMAIL: admin@infrapilot.local
      E2E_ADMIN_PASSWORD: CiSeed-Password-2026
      DEMO_SEED_PASSWORD: CiDemo-Password-2026
      EXPOSE_RESET_TOKEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name infrapilot-mongo --publish 27017:27017 mongo:8.0 mongod --replSet rs0 --bind_ip_all
          ready=false
          for attempt in {1..30}; do
            if docker exec infrapilot-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs infrapilot-mongo
            echo "MongoDB did not start" >&2
            exit 1
          fi
          docker exec infrapilot-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in {1..30}; do
            if docker exec infrapilot-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - run: npm run db:init:mongo
      - run: npm run db:seed:mongo
      - name: Demo dataset validation (no database writes)
        run: npm run db:seed:demo:dry-run
      - name: Seed the demo environment twice to prove idempotency
        run: |
          npm run db:seed:demo
          npm run db:seed:demo
      - name: Verify the demo environment
        run: npm run db:verify:demo
      - name: Prove demo cleanup is scoped to seeded records
        run: |
          npm run db:seed:demo:cleanup -- --yes
          npm run db:verify:demo -- --expect-empty
      - name: Re-seed the demo data used by the browser suite
        run: |
          npm run db:seed:demo
          npm run db:verify:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright)
        run: |
          set -o pipefail
          npm run test:e2e -- --reporter=list,html 2>&1 | tee /tmp/playwright.txt
      - name: Report end-to-end failures
        if: failure()
        run: |
          if [ -f /tmp/playwright.json ]; then node scripts/report-e2e-failures.mjs /tmp/playwright.json; fi
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' /tmp/playwright.txt \
            | awk '/^  [0-9]+\) /{flag=1} flag || /^Running [0-9]+ tests?/{print}' \
            | head -45 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
